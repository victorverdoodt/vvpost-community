name: CLA

# Pede a assinatura do CLA (docs/CLA.md) no primeiro PR de quem contribui de fora e guarda as
# assinaturas em signatures/cla.json, na branch cla-signatures deste repositório. Fica desligado
# até o mantenedor criar a variável de repositório CLA_ENABLED=true (docs/CLA.md, docs/packaging.md).
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    if: >-
      vars.CLA_ENABLED == 'true' &&
      (github.event_name == 'pull_request_target' ||
       (github.event.issue.pull_request &&
        (github.event.comment.body == 'Li o CLA e concordo com os termos.' || github.event.comment.body == 'recheck')))
    runs-on: ubuntu-latest
    steps:
      # Não faz checkout do código do PR: só lê e grava o arquivo de assinaturas.
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/docs/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: victorverdoodt,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: Li o CLA e concordo com os termos.
          custom-notsigned-prcomment: >-
            Obrigado pela contribuição! Antes do merge, pedimos que você leia o
            [Contrato de Licença de Contribuidor](https://github.com/${{ github.repository }}/blob/main/docs/CLA.md)
            e responda neste PR com o comentário abaixo. Só é preciso fazer isso uma vez.
          custom-allsigned-prcomment: Todas as pessoas autoras deste PR assinaram o CLA. Obrigado!
          lock-pullrequest-aftermerge: false
