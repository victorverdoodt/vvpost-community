name: Release

# Gera os instaladores (Windows, macOS e Linux) e o pacote npm `vvpost` sob demanda. Só roda
# quando o mantenedor dispara em Actions > Release > Run workflow. Os instaladores ficam como
# artefatos do workflow; nada vai para GitHub Releases. O npm só é publicado com publish_npm
# marcado e o segredo NPM_TOKEN configurado. Guia em docs/packaging.md.
on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publicar o pacote vvpost no npm (precisa do segredo NPM_TOKEN)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  installers:
    name: Instalador (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Sem os segredos o build sai sem assinatura; com eles, assina (e notariza no macOS).
      - run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.target }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          VVPOST_WIN_PUBLISHER: ${{ vars.VVPOST_WIN_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - run: npm run check:installer
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.7z
            dist/*.deb
            dist/*.tar.xz
          if-no-files-found: error

  npm:
    name: Pacote npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run build:cli
      - run: node scripts/e2e-cli.mjs --npm
      - run: npm pack --dry-run
        working-directory: packages/cli
      - if: inputs.publish_npm
        run: npm publish
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
