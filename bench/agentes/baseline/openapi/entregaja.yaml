openapi: 3.1.0
info:
  title: EntregaJá
  version: '1.0'
  description: Transportadora reserva da Loja, usada quando a TransNorte não responde.
servers:
  - url: https://frete.entregaja.example
paths:
  /v1/frete:
    get:
      operationId: cotarFrete
      summary: Cota o frete para um CEP
      security:
        - bearer: []
      parameters:
        - name: cep
          in: query
          required: true
          schema: { type: string }
        - name: peso
          in: query
          required: true
          description: Peso em gramas
          schema: { type: integer }
      responses:
        '200':
          description: Cotação
          content:
            application/json:
              schema:
                type: object
                required: [precoCentavos, prazo]
                properties:
                  precoCentavos: { type: integer }
                  prazo: { type: integer, description: Prazo em dias corridos }
              example:
                precoCentavos: 1800
                prazo: 5
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Token em ENTREGAJA_TOKEN
